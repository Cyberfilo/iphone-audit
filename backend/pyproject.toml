[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone_audit"
version = "1.000"
description = "iPhone audit and hardening tool — backend"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "iSpow" }]
dependencies = [
    "pymobiledevice3>=4.27,<5",
    "pydantic>=2.7",
    "click>=8.1",
    "rich>=13.7",
    "openai>=1.50",
    "cryptography>=42",
    "lxml>=5.0",
]

[project.optional-dependencies]
forensic = [
    "mvt>=2.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
iphone-audit = "iphone_audit.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["iphone_audit*"]

[tool.setuptools.package-data]
iphone_audit = ["data/*.json", "data/mobilegestalt_baselines/*.json", "data/mobilegestalt_baselines/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
